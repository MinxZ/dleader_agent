# config.yaml
azure_openai:
  endpoint: "https://patent-search.openai.azure.com/"
  api_key: "xxx"  # 替换为你的实际密钥
  api_version: "2024-12-01-preview"
  model_name: "gpt-4o"
  deployment: "gpt-4o"

# 默认参数设置
default_settings:
  max_completion_tokens: 100000
  temperature: 0.7
  
# 默认系统消息
default_system_message: "You are a helpful assistant."